pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # A few hundred site assets plus ~40 tiles x 40 panoramas for the 360 tour;
  # cache the open descriptors and stat() results.
  open_file_cache max=8000 inactive=60s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;
  charset utf-8;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Serve the .gz files produced by scripts/precompress.mjs instead of
  # re-compressing identical bytes on every request. gzip stays on as the
  # fallback for anything not pre-compressed.
  # (.br files are emitted too, but brotli_static needs a module that stock
  #  nginx does not ship — enable it if you move to a brotli-enabled image.)
  gzip_static on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/manifest+json
    application/json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /_astro/ {
      try_files $uri =404;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Tour assets are served separately from the general image rule.
    location ^~ /tour/ {
      try_files $uri =404;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:avif|webp|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
      try_files $uri =404;
      access_log off;
      add_header Cache-Control "public, max-age=2592000";
    }

    location = /site.webmanifest {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=3600";
    }

    location / {
      try_files $uri $uri/ $uri/index.html =404;
      add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
    }
  }
}
